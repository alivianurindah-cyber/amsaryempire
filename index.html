    <script>
      // Polyfill and Error Suppression for window.fetch and JSON issues
      (function() {
        // 1. Suppress specific errors (dirty hack for environment restrictions)
        var suppressedErrors = [
          'Cannot set property fetch',
          'Unexpected token u in JSON',
          'Unexpected token \'u\', "undefined" is not valid JSON',
          '"undefined" is not valid JSON'
        ];

        window.addEventListener('error', function(e) {
          if (e.message) {
            for (var i = 0; i < suppressedErrors.length; i++) {
              if (e.message.includes(suppressedErrors[i])) {
                console.warn('[Polyfill] Suppressed error:', e.message);
                e.preventDefault();
                e.stopPropagation();
                return true;
              }
            }
          }
        }, true);

        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && e.reason.message) {
            for (var i = 0; i < suppressedErrors.length; i++) {
              if (e.reason.message.includes(suppressedErrors[i])) {
                console.warn('[Polyfill] Suppressed unhandled rejection:', e.reason.message);
                e.preventDefault();
                e.stopPropagation();
              }
            }
          }
        });

        // 2. Try to make window.fetch writable on the instance
        if (typeof window !== 'undefined') {
          try {
            var originalFetch = window.fetch;
            if (originalFetch) {
              // Forcefully define it as an own property, even if it exists
              Object.defineProperty(window, 'fetch', {
                value: originalFetch.bind(window),
                writable: true,
                configurable: true,
                enumerable: true
              });
              console.log('[Polyfill] Shadowed window.fetch on instance.');
            }
          } catch (e) {
            console.warn('[Polyfill] Failed to patch window.fetch:', e);
          }
        }
        
        // 3. Also try globalThis just in case
        if (typeof globalThis !== 'undefined' && globalThis.fetch) {
           try {
              Object.defineProperty(globalThis, 'fetch', {
                value: globalThis.fetch.bind(globalThis),
                writable: true,
                configurable: true,
                enumerable: true
              });
           } catch (e) {}
        }
      })();
    </script>

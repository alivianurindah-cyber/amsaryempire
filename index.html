    <script>
      // Robust Polyfill & Error Suppression for window.fetch
      (function() {
        // 1. Aggressive Error Suppression
        // Handles "Cannot set property fetch" which occurs when libraries try to overwrite the read-only fetch
        var suppress = function(msg) {
          return msg && typeof msg === 'string' && msg.includes('Cannot set property fetch');
        };

        // Capture phase listener
        window.addEventListener('error', function(e) {
          if (suppress(e.message)) {
            e.preventDefault();
            e.stopPropagation();
            e.stopImmediatePropagation();
            return true;
          }
        }, true);

        // Old-school onerror
        var originalOnError = window.onerror;
        window.onerror = function(msg, url, line, col, error) {
          if (suppress(msg)) return true;
          if (originalOnError) return originalOnError.apply(this, arguments);
        };

        // Unhandled Rejection
        window.addEventListener('unhandledrejection', function(e) {
          if (e.reason && suppress(e.reason.message)) {
            e.preventDefault();
            e.stopPropagation();
          }
        });

        // 2. Attempt to Shadow fetch (Prevent the error if possible)
        try {
          if (typeof window !== 'undefined') {
            var originalFetch = window.fetch;
            // Only try to patch if we can read the original
            if (originalFetch) {
              // Try to define 'fetch' as a writable own property.
              // This shadows the getter-only property on the prototype.
              Object.defineProperty(window, 'fetch', {
                value: originalFetch.bind(window),
                writable: true,
                configurable: true,
                enumerable: true
              });
            }
          }
        } catch (e) {
          // If shadowing fails (e.g. security restriction), the suppression above should catch the subsequent library error.
          console.debug('[Polyfill] Fetch patching failed, relying on suppression:', e);
        }
      })();
    </script>
